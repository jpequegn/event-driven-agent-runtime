[project]
name = "event-driven-agent-runtime"
version = "0.1.0"
description = "Local durable markdown agents with review-gated outcomes and replay"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "pyyaml>=6,<7", "typer>=0.16,<1"]
[project.scripts]
edr = "event_runtime.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["event_runtime"]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.ruff.lint.per-file-ignores]
"event_runtime/cli.py" = ["B008"]
