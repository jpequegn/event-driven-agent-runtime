name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run python -m event_runtime demo --out data/ci-demo
      - run: uv run python -m event_runtime --db data/ci-demo/runtime.db verify
      - run: uv run python -m event_runtime evaluate --out reports/ci-evaluation
